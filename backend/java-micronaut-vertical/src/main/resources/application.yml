micronaut:
  application:
    name: java-micronaut-vertical
  server:
    context-path: /api
    cors:
      enabled: true
      configurations:
        default:
          allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  serde:
    serialization:
      inclusion: NON_NULL
  security:
    reject-not-found: false
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:pleaseChangeThisSecretForANewOne}
  metrics:
    enabled: ${OTEL_ENABLED:false}
    export:
      otlp:
        enabled: true
        url: ${OTEL_METRICS_URL:http://otel-collector:4318/v1/metrics}
        step: 10s
    binders:
      jvm:
        enabled: false
      processor:
        enabled: false
      uptime:
        enabled: false
      logback:
        enabled: false
      files:
        enabled: false
      jdbc:
        enabled: false
      hibernate:
        enabled: false

datasources:
  default:
    db-type: postgres
    dialect: POSTGRES
    driver-class-name: org.postgresql.Driver

jpa:
  default:
    entity-scan:
      packages: com.sakrafux.realworld
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: false

endpoints:
  health:
    details-visible: ANONYMOUS