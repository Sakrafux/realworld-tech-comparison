services:
  backend:
    build:
      context: ../backend/go-chi-hexagonal
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_TYPE=postgres
      - DB_PORT=5432
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=realworld
      - JWT_SECRET=feNiAMDB8g1bMy7AvcKdYAEi++SpBdkrgM0ug6NPII4=
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db
    networks:
      - realworld-network
