services:
  backend:
    build:
      context: ../backend/java-quarkus-vertical
      dockerfile: src/main/docker/Dockerfile.native-micro
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/realworld
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: password
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db
    networks:
      - realworld-network
