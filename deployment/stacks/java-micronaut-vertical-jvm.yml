services:
  backend:
    build:
      context: ../backend/java-micronaut-vertical
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - MICRONAUT_SERVER_PORT=8080
      - DATASOURCES_DEFAULT_URL=jdbc:postgresql://db:5432/realworld
      - DATASOURCES_DEFAULT_USERNAME=postgres
      - DATASOURCES_DEFAULT_PASSWORD=password
      - DATASOURCES_DEFAULT_DRIVER_CLASS_NAME=org.postgresql.Driver
      - JWT_SECRET=feNiAMDB8g1bMy7AvcKdYAEi++SpBdkrgM0ug6NPII4=
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - OTEL_ENABLED=true
      - OTEL_METRICS_URL=http://otel-collector:4318/v1/metrics
    depends_on:
      - db
    networks:
      - realworld-network
